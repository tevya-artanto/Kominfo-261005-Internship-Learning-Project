<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
</head>
<body>
    <!-- cat details screen -->
    <div id="details-screen" class="hidden">

        <div class="details-page">

            <!-- button to go back -->
            <button id="close-details" class="close-button">
                ×
            </button>


            <!-- left side -->
            <div class="details-left">

                <div class="large-cat-image">
                    CAT IMAGE
                </div>

                <button id="add-text-button" class="dark-button">
                    Add text to image
                </button>

            </div>


            <!-- right side -->
            <div class="details-right">

                <h2>Cat details</h2>


                <!-- cat tags -->
                <div class="detail-tags">
                    <span>cute</span>
                    <span>orange</span>
                </div>


                <!-- cat id -->
                <div class="cat-id">

                    <strong>ID</strong>

                    <p>
                        abc123xyz
                    </p>

                </div>


                <hr>


                <!-- comments -->
                <h3>
                    Comments · 4
                </h3>


                <div class="comment">

                    <strong>John</strong>

                    <p>
                        This cat looks extremely serious.
                    </p>

                    <small>
                        2 hours ago
                    </small>

                </div>


                <div class="comment">

                    <strong>Sarah</strong>

                    <p>
                        😂
                    </p>

                    <small>
                        Yesterday
                    </small>

                </div>


                <!-- add comment form -->
                <div class="add-comment">

                    <h3>
                        Add comment
                    </h3>

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username">


                    <label for="comment">
                        Comment
                    </label>

                    <textarea
                        id="comment"
                        placeholder="Write a comment..."></textarea>


                    <button class="dark-button">
                        Post comment
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- add text screen -->
    <div id="text-screen" class="hidden">

        <div class="text-page">

            <!-- go back to details -->
            <button id="close-text" class="close-button">
                ×
            </button>
</body>
</html>
