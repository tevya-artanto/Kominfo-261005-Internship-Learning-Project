<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Text</title>
</head>
<body>
        <!-- add text screen -->
    <div id="text-screen" class="hidden">

        <div class="text-page">

            <!-- go back to details -->
            <button id="close-text" class="close-button">
                ×
            </button>


            <!-- image preview -->
            <div class="text-preview-section">

                <h2>
                    Add text to cat
                </h2>


                <div class="text-cat-image">

                    <span>
                        CAT IMAGE
                    </span>

                    <p id="preview-text">
                        I NEED MORE SNACKS
                    </p>

                </div>

            </div>


            <!-- text options -->
            <div class="text-settings">

                <h2>
                    Text settings
                </h2>


                <label for="image-text">
                    Text
                </label>

                <input
                    type="text"
                    id="image-text"
                    value="I need more snacks">


                <label for="text-size">
                    Size
                </label>

                <input
                    type="number"
                    id="text-size"
                    value="50">


                <label for="text-color">
                    Color
                </label>

                <div class="color-box">

                    <input
                        type="color"
                        id="text-color"
                        value="#222222">

                    <span id="color-number">
                        #222222
                    </span>

                </div>

            </div>

        </div>

    </div>
</body>
</html>
